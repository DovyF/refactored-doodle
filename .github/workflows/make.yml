# One click from a plan to a finished video. The plan (videos/<id>/plan.json) is the only thing a "brain" writes.
#   prepare: voice (Kokoro) + word timings (Whisper) + music/SFX mix + one Remotion bundle
#   render:  frames split across 10 runners (GitHub runs about 10 at once; more just queue)
#   stitch:  frames + sound -> MP4 (artifact "video") and a contact sheet (artifact "sheet") to check
name: make
on:
  workflow_dispatch:
    inputs:
      plan_json: { description: "Paste the whole plan here (from your Claude chat). Leave empty to use the file below.", default: "" }
      plan: { description: "Plan file", default: "videos/awake/plan.json" }
      chunks: { description: "Parallel render machines (GitHub runs ~10 at once; more just queue)", default: "10" }
      scale: { description: "Render scale (0.75 = 810x1440, upscaled to 1080x1920)", default: "0.75" }

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Use the pasted plan, if any
        env: { PLAN_JSON: "${{ inputs.plan_json }}", PLAN_FILE: "${{ inputs.plan }}" }
        run: |
          mkdir -p work
          if [ -n "$PLAN_JSON" ]; then printf '%s' "$PLAN_JSON" > work/plan.json; else cp "$PLAN_FILE" work/plan.json; fi
          python3 -c "import json; p = json.load(open('work/plan.json')); print('plan ok:', p.get('id'), len(p['lines']), 'lines')"
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: scripts/requirements.txt }
      - run: pip install -q -r scripts/requirements.txt
      - uses: actions/cache@v4
        with: { path: models, key: kokoro-v1.0 }
      - name: Voice models (open source)
        run: |
          mkdir -p models
          [ -f models/kokoro-v1.0.onnx ] || curl -sSL -o models/kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          [ -f models/voices-v1.0.bin ] || curl -sSL -o models/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
      - uses: actions/cache@v4
        with: { path: ~/.cache/huggingface, key: whisper-base-en }
      - name: Voice + word timings
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          mkdir -p work && python scripts/make_voice.py work/plan.json models work
      - name: Music + sound effects
        run: python scripts/make_sound.py work/plan.json work
      - name: Props for the renderer
        run: |
          python -c "import json; json.dump({'plan': json.load(open('work/plan.json')), 'words': json.load(open('work/words.json'))}, open('work/props.json', 'w'))"
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/cache@v4
        id: nm
        with:
          path: node_modules
          key: nm-${{ hashFiles('package-lock.json') }}
      - if: steps.nm.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund
      - run: node scripts/bundle.mjs out/bundle
      - id: m
        run: echo "matrix=$(python3 -c "import json; print(json.dumps(list(range(int('${{ inputs.chunks }}')))))")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with: { name: work, path: work, retention-days: 3 }
      - uses: actions/upload-artifact@v4
        with: { name: bundle, path: out/bundle, retention-days: 1 }

  render:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        chunk: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/cache@v4
        id: nm
        with:
          path: node_modules
          key: nm-${{ hashFiles('package-lock.json') }}
      - if: steps.nm.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with: { name: bundle, path: out/bundle }
      - uses: actions/download-artifact@v4
        with: { name: work, path: work }
      - run: npx remotion browser ensure
      - run: node scripts/render-chunk.mjs PlanShort ${{ matrix.chunk }} ${{ inputs.chunks }} out/frames ${{ inputs.scale }} out/bundle work/props.json
      - uses: actions/upload-artifact@v4
        with: { name: "frames-${{ matrix.chunk }}", path: out/frames, retention-days: 1, if-no-files-found: ignore }

  stitch:
    needs: render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: "frames-*", path: out/frames, merge-multiple: true }
      - uses: actions/download-artifact@v4
        with: { name: work, path: work }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
      - name: Stitch frames + sound, contact sheet
        run: |
          ls out/frames | wc -l
          ffmpeg -v error -y -framerate 30 -i out/frames/frame_%05d.jpg -i work/mix.wav \
            -vf "scale=1080:1920:flags=lanczos,format=yuv420p" -c:v libx264 -preset medium -crf 18 \
            -c:a aac -b:a 192k -map 0:v -map 1:a -shortest -movflags +faststart video.mp4
          ffmpeg -v error -y -i video.mp4 -vf "fps=1/2,scale=270:480,tile=6x4" -frames:v 1 sheet.jpg
          ffprobe -v error -show_entries format=duration:stream=width,height,nb_frames -of compact video.mp4
      - uses: actions/upload-artifact@v4
        with: { name: video, path: video.mp4, retention-days: 30 }
      - uses: actions/upload-artifact@v4
        with: { name: sheet, path: sheet.jpg, retention-days: 30 }
